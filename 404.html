  :root {
    --bg: #0F0F11;
    --card: #141416;
    --line: #26262A;
    --ink: #F4F4F2;
    --muted: #9A9A97;
    --accent: #34C77B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, system-ui, "SF Pro Display", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }
  .lockup { height: 34px; width: auto; color: var(--ink); margin-bottom: 40px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  h1 {
    font-size: 28px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.55;
    margin: 0;
  }
</style>
